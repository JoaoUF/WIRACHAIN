server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files with long cache (immutable)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|map|json)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # HTML files: no caching to allow immediate deploys
  location ~* \.(?:html)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # SPA history fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers
  add_header X-Content-Type-Options nosniff;
}