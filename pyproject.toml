[tool.black]
line-length = 120
target-version = ['py310']
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
  | static
  | media
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
known_first_party = ["apps", "authenticationApp", "medicalApp"]
skip = ["migrations", "venv", ".venv", "static", "media"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = ".git,__pycache__,migrations,static,media,venv,.venv"

[tool.djlint]
profile = "django"
ignore = "jinja"
exclude = "venv,.venv,migrations,static,media"